<!DOCTYPE html>
<html>
<head>
    <title>Login Form</title>
</head>

<body>

<form>

    <table>

        <tr>
            <td>Username:</td>
            <td>
                <input type="text" name="username" size="30">
            </td>
        </tr>

        <tr>
            <td>Password:</td>
            <td>
                <input type="password" name="password" size="30">
            </td>
        </tr>

        <tr>
            <td>City of<br>Employment:</td>
            <td>
                <input type="text" name="city" size="30">
            </td>
        </tr>

        <tr>
            <td>Web server:</td>
            <td>
                <select name="server">
                    <option>— Choose a server —</option>
                    <option>Apache</option>
                    <option>Microsoft IIS</option>
                    <option>NGINX</option>
                </select>
            </td>
        </tr>

        <tr>
            <td>Please specify<br>your role:</td>
            <td>
                <input type="radio" name="role" value="Admin"> Admin<br>
                <input type="radio" name="role" value="Engineer"> Engineer<br>
                <input type="radio" name="role" value="Manager"> Manager<br>
                <input type="radio" name="role" value="Guest"> Guest
            </td>
        </tr>

        <tr>
            <td>Single Sign-on<br>to the following:</td>
            <td>
                <input type="checkbox" name="mail"> Mail<br>
                <input type="checkbox" name="payroll"> Payroll<br>
                <input type="checkbox" name="selfservice"> Self-service
            </td>
        </tr>

        <tr>
            <td></td>
            <td>
                <input type="submit" value="Login">
                <input type="reset" value="Reset">
            </td>
        </tr>

    </table>

</form>

</body>
</html>
