<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
</head>

<body>

<table width="540" height="570" bgcolor="#e6e6e6" align="center">
    <tr>
        <td>

            <h2 align="center">
                <u>Registration form</u>
            </h2>

            <br>

            <form>

                <table align="center" cellpadding="5">

                    <tr>
                        <td>First Name</td>
                        <td>
                            <input type="text" name="firstname" size="32">
                        </td>
                    </tr>

                    <tr>
                        <td>Last Name</td>
                        <td>
                            <input type="text" name="lastname" size="32">
                        </td>
                    </tr>

                    <tr>
                        <td>Nick Name</td>
                        <td>
                            <input type="text" name="nickname" size="32">
                        </td>
                    </tr>

                    <tr>
                        <td>e-mail</td>
                        <td>
                            <input type="email" name="email" size="32">
                        </td>
                    </tr>

                    <tr>
                        <td>Password</td>
                        <td>
                            <input type="password" name="password" size="32">
                        </td>
                    </tr>

                    <tr>
                        <td>Date of Birth</td>
                        <td>
                            <input type="text" name="dob" size="32">
                        </td>
                    </tr>

                    <tr>
                        <td>Gender</td>
                        <td>
                            <input type="radio" name="gender" value="male">Male
                            <input type="radio" name="gender" value="female">Female
                            <input type="radio" name="gender" value="others">Others
                        </td>
                    </tr>

                    <tr>
                        <td>Mobile</td>
                        <td>
                            <input type="text" name="mobile" size="32">
                        </td>
                    </tr>

                    <tr>
                        <td>Address</td>
                        <td>
                            <textarea name="address" cols="33" rows="5"></textarea>
                        </td>
                    </tr>

                    <tr>
                        <td></td>
                        <td>
                            <input type="submit" value="submit">
                            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                            <input type="reset" value="reset">
                        </td>
                    </tr>

                </table>

            </form>

        </td>
    </tr>
</table>

</body>
</html>
