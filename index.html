<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In / Sign Up</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
        }

        .container {
            width: 700px;
            max-width: 95%;
            min-height: 450px;
            display: flex;
            background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            overflow: hidden;
            border-radius: 5px;
        }

        /* LEFT SIDE */
        .login-section {
            width: 50%;
            padding: 60px 45px;
            text-align: center;
        }

        .login-section h1 {
            font-size: 30px;
            margin-bottom: 25px;
            color: #111;
        }

        .social {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .social span {
            width: 38px;
            height: 38px;
            border: 1px solid #ddd;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #555;
        }

        .or {
            color: #777;
            font-size: 13px;
            margin-bottom: 12px;
        }

        input {
            width: 100%;
            height: 42px;
            border: none;
            background: #edf0f4;
            margin-bottom: 12px;
            padding: 0 14px;
            outline: none;
            font-size: 13px;
        }

        .forgot {
            font-size: 13px;
            color: #555;
            margin: 10px 0 18px;
        }

        button {
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .signin-btn {
            width: 125px;
            height: 40px;
            border-radius: 25px;
            background: linear-gradient(90deg, #ff4b20, #ff5722);
            color: white;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .signin-btn:hover {
            transform: scale(1.05);
        }

        /* RIGHT SIDE */
        .signup-section {
            width: 50%;
            background: linear-gradient(135deg, #ff321f, #ff4b3e);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
        }

        .signup-section h1 {
            font-size: 28px;
            margin-bottom: 20px;
        }

        .signup-section p {
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 25px;
            max-width: 230px;
        }

        .signup-btn {
            width: 130px;
            height: 40px;
            border-radius: 25px;
            border: 1px solid white;
            background: transparent;
            color: white;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .signup-btn:hover {
            background: white;
            color: #ff432e;
        }

        /* RESPONSIVE */
        @media (max-width: 650px) {
            .container {
                flex-direction: column;
            }

            .login-section,
            .signup-section {
                width: 100%;
            }

            .login-section {
                padding: 45px 35px;
            }

            .signup-section {
                min-height: 300px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- SIGN IN -->
        <div class="login-section">

            <h1>Sign in</h1>

            <div class="social">
                <span>f</span>
                <span>G+</span>
                <span>in</span>
            </div>

            <div class="or">or use your account</div>

            <form id="loginForm">

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <div class="forgot">
                    Forgot your password?
                </div>

                <button class="signin-btn" type="submit">
                    SIGN IN
                </button>

            </form>
        </div>


        <!-- SIGN UP -->
        <div class="signup-section">

            <h1>Hello, Friend!</h1>

            <p>
                Enter your personal details and start
                journey with us
            </p>

            <button class="signup-btn" onclick="signup()">
                SIGN UP
            </button>

        </div>

    </div>


    <script>

        document.getElementById("loginForm").addEventListener("submit", function(e) {

            e.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            if (email && password) {
                alert("Sign In button clicked!");
            }

        });


        function signup() {
            alert("Sign Up page will open here.");
        }

    </script>

</body>
</html>
