<!DOCTYPE html>
<html>
<head>
    <title>Weather Station</title>
</head>

<body>

<center>
    <font size="7">
        <b>Weather Station</b>
    </font>
</center>

<br>

<table border="5" bordercolor="gray" cellpadding="10" cellspacing="0" width="95%" align="center">

    <!-- Heading Row -->
    <tr>
        <th rowspan="2">
            <font size="6">Station</font>
        </th>

        <th colspan="2">
            <font size="6">Temperature</font>
        </th>

        <th rowspan="2">
            <font size="6">Humidity</font>
        </th>

        <th rowspan="2">
            <font size="6">Weather</font>
        </th>
    </tr>

    <!-- Temperature Sub Heading -->
    <tr>
        <th>
            <font size="5">Max</font>
        </th>

        <th>
            <font size="5">Min</font>
        </th>
    </tr>

    <!-- USA -->
    <tr>
        <td>
            <font size="5">USA</font>
        </td>

        <td align="center">
            <font size="5">24</font>
        </td>

        <td align="center">
            <font size="5">19</font>
        </td>

        <td align="center">
            <font size="5">60%</font>
        </td>

        <td>
            <font size="5">cloudy</font>
        </td>
    </tr>

    <!-- Germany -->
    <tr>
        <td>
            <font size="5">Germany</font>
        </td>

        <td align="center">
            <font size="5">5</font>
        </td>

        <td align="center">
            <font size="5">-1</font>
        </td>

        <td align="center">
            <font size="5">70%</font>
        </td>

        <td>
            <font size="5">Rainy</font>
        </td>
    </tr>

</table>

</body>
</html>
