<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Navbar</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #f8fafa;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Main Navbar */

        .navbar {
            width: 365px;
            height: 38px;

            background: #111111;

            border: 3px solid #111111;
            border-radius: 25px;

            display: flex;
            align-items: center;

            padding: 2px 4px;

            box-shadow:
                0 7px 12px rgba(0, 0, 0, 0.35);
        }

        /* Logo */

        .logo {
            width: 29px;
            height: 29px;

            background: white;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-right: 13px;
        }

        .logo::before {
            content: "◒";
            color: #111;
            font-size: 17px;
            transform: rotate(-25deg);
        }

        /* Menu */

        .menu {
            display: flex;
            align-items: center;
            gap: 22px;

            flex: 1;
        }

        .menu a {
            color: white;
            text-decoration: none;

            font-size: 9px;
            white-space: nowrap;
        }

        .menu a:hover {
            color: #cccccc;
        }

        /* Email Button */

        .email {
            height: 29px;

            background: white;
            color: #111;

            border-radius: 20px;

            display: flex;
            align-items: center;

            padding: 0 13px;

            font-size: 9px;

            white-space: nowrap;
        }

    </style>
</head>

<body>

    <nav class="navbar">

        <!-- Logo -->
        <div class="logo"></div>

        <!-- Menu -->
        <div class="menu">
            <a href="#">Work</a>
            <a href="#">About</a>
            <a href="#">Playground</a>
            <a href="#">Resource</a>
        </div>

        <!-- Email -->
        <div class="email">
            ihyaet@gmail.com
        </div>

    </nav>

</body>
</html>
